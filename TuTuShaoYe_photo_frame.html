<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuTuShaoYePhotoFrame</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <audio controls loop>
        <source src="/Users/yinwenpei/Downloads/hukoutuoxian.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <style>
        html, body, .stage {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        .container {
            perspective: 2000px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            position: relative;
        }

        .img-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 80vw; /* 初始宽度 */
            height: 80vh; /* 初始高度 */
            transform-style: preserve-3d;
        }

        .img {
            width: 100%;
            height: 100%;
            position: absolute;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            backface-visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="container">
            <div class="ring">
                <div class="img-container" data-url="/Users/yinwenpei/Projects/photos_slide/ImageSlider/kiss.JPG" data-ratio="1.5">
                    <div class="img"></div>
                </div>
                <div class="img-container" data-url="/Users/yinwenpei/Projects/photos_slide/ImageSlider/hugNanjiabawa.jpg" data-ratio="0.75">
                    <div class="img"></div>
                </div>
                <div class="img-container" data-url="/Users/yinwenpei/Projects/photos_slide/ImageSlider/zhufengshentu.JPG" data-ratio="1.5">
                    <div class="img"></div>
                </div>
                <div class="img-container" data-url="/Users/yinwenpei/Projects/photos_slide/ImageSlider/dashuxia.JPG" data-ratio="1.5">
                    <div class="img"></div>
                </div>
                <div class="img-container" data-url="/Users/yinwenpei/Projects/photos_slide/ImageSlider/Mirror.JPG" data-ratio="0.75">
                    <div class="img"></div>
                </div>
                <div class="img-container" data-url="https://picsum.photos/id/51/600/400" data-ratio="1.5">
                    <div class="img"></div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.0/gsap.min.js"></script>
    <script>
        let xPos = 0;

        // Function to adjust container size based on the image aspect ratio
        function adjustContainerSize() {
            document.querySelectorAll('.img-container').forEach((imgContainer, index) => {
                const aspectRatio = parseFloat(imgContainer.getAttribute('data-ratio'));
                if (aspectRatio < 1) {
                    // If aspect ratio is less than 1 (taller than wide), set width to 40vw
                    width = '40vw';
                    height = `calc(${width} / ${aspectRatio})`;
                } else {
                    // Otherwise, set width to 80vw
                    width = '80vw';
                    height = `calc(${width} / ${aspectRatio})`;
                }
                // const width = '80vw'; // Adjust width to 80% of viewport width
                // const height = `calc(${width} / ${aspectRatio})`; // Adjust height based on aspect ratio
                imgContainer.style.width = width;
                imgContainer.style.height = height;

                // Set background image for the img element
                const imgElement = imgContainer.querySelector('.img');
                imgElement.style.backgroundImage = `url(${imgContainer.getAttribute('data-url')})`;
            });
        }

        // Adjust size for each image container
        adjustContainerSize();

        gsap.timeline()
            .set('.ring', { rotationY: 180, cursor: 'grab' }) // set initial rotationY so the parallax jump happens off-screen
            .set('.img-container', { // apply transform rotations to each image container
                rotateY: (i) => i * -36,
                transformOrigin: '50% 50% 1800px',
                z: -1800,
                backfaceVisibility: 'hidden'
            })
            .from('.img-container', {
                duration: 1.5,
                y: 200,
                opacity: 0,
                stagger: 0.1,
                ease: 'expo'
            })
            .add(() => {
                document.querySelectorAll('.img-container').forEach(imgContainer => {
                    imgContainer.addEventListener('mouseenter', (e) => {
                        let current = e.currentTarget;
                        gsap.to('.img-container', { opacity: (i, t) => (t == current) ? 1 : 0.5, ease: 'power3' });
                    });

                    imgContainer.addEventListener('mouseleave', (e) => {
                        gsap.to('.img-container', { opacity: 1, ease: 'power2.inOut' });
                    });
                });
            }, '-=0.5');

        document.addEventListener('mousedown', dragStart);
        document.addEventListener('touchstart', dragStart);

        function dragStart(e) {
            if (e.touches) e.clientX = e.touches[0].clientX;
            xPos = Math.round(e.clientX);
            gsap.set('.ring', { cursor: 'grabbing' });
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag);
        }

        function drag(e) {
            if (e.touches) e.clientX = e.touches[0].clientX;
            gsap.to('.ring', {
                rotationY: '-=' + ((Math.round(e.clientX) - xPos) % 360),
                onUpdate: () => { gsap.set('.img-container', { backgroundPosition: (i) => getBgPos(i) }) }
            });

            xPos = Math.round(e.clientX);
        }

        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);

        function dragEnd(e) {
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
            gsap.set('.ring', { cursor: 'grab' });
        }

        function getBgPos(i) { //returns the background-position string to create parallax movement in each image
            return (100 - gsap.utils.wrap(0, 360, gsap.getProperty('.ring', 'rotationY') - 180 - i * 36) / 360 * 500) + 'px 0px';
        }
    </script>
</body>
</html>
